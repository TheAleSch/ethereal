name: Verify published release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-published-package-and-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify npm artifact and unmodified registry install
        run: npm run verify:release
